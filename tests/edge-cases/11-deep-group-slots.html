<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/nova-tokens.css">
<link rel="stylesheet" href="/css/nova-colors.css">
<link rel="stylesheet" href="/css/nova-form-controls.css">
<script type="module" src="/js/nova-temporal/nova-input-datetime.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-duration.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-temporal-group.js"></script>
<style>body { padding: 2rem; }</style>
</head><body>
<nova-input-temporal-group>
  <label slot="t0-label">Launch</label>
  <nova-input-datetime slot="t0" value="2026-04-09T08:00:00Z"></nova-input-datetime>
  <label slot="d0-label">Burn 1</label>
  <nova-input-duration slot="d0" value="PT45M"></nova-input-duration>
  <label slot="d1-label">Coast</label>
  <nova-input-duration slot="d1" value="PT2H"></nova-input-duration>
  <label slot="d2-label">Burn 2</label>
  <nova-input-duration slot="d2" value="PT30M"></nova-input-duration>
  <label slot="d3-label">Descent</label>
  <nova-input-duration slot="d3" value="PT1H15M"></nova-input-duration>
  <label slot="d4-label">Cool Down</label>
  <nova-input-duration slot="d4" value="PT2H30M"></nova-input-duration>
  <label slot="t1-label">Mission End</label>
  <nova-input-datetime slot="t1"></nova-input-datetime>
  <output slot="output"><span class="output-label">Total Mission Time</span><span class="output-value"></span></output>
</nova-input-temporal-group>
</body></html>
