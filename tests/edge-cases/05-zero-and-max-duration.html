<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/nova-tokens.css">
<link rel="stylesheet" href="/css/nova-colors.css">
<link rel="stylesheet" href="/css/nova-form-controls.css">
<script type="module" src="/js/nova-temporal/nova-input-datetime.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-duration.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-temporal-group.js"></script>
<style>body { padding: 2rem; }</style>
</head><body>
<nova-input-duration value="PT0S" min="PT0S"></nova-input-duration>
<nova-input-duration value="P999DT23H59M59.999999999S" smallest-unit="nanosecond"></nova-input-duration>
<!-- compute group that lands exactly on midnight -->
<nova-input-temporal-group>
  <nova-input-datetime slot="t0" value="2026-04-09T23:00:00Z"></nova-input-datetime>
  <nova-input-duration slot="d0" value="PT1H"></nova-input-duration>
  <nova-input-datetime slot="t1"></nova-input-datetime>
  <output slot="output"><span class="output-label">Midnight Landing</span><span class="output-value"></span></output>
</nova-input-temporal-group>
</body></html>
