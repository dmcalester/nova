<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/nova-tokens.css">
<link rel="stylesheet" href="/css/nova-colors.css">
<link rel="stylesheet" href="/css/nova-form-controls.css">
<script type="module" src="/js/nova-temporal/nova-input-datetime.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-duration.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-temporal-group.js"></script>
<style>body { padding: 2rem; }</style>
</head><body>
<nova-input-datetime smallest-unit="nanosecond" value="2026-04-09T14:30:45.123456789Z"></nova-input-datetime>
<nova-input-duration smallest-unit="nanosecond" value="PT1H30M45.123456789S"></nova-input-duration>
<nova-input-temporal-group>
  <nova-input-datetime slot="t0" smallest-unit="nanosecond" value="2026-04-09T14:30:45.000000000Z"></nova-input-datetime>
  <nova-input-duration slot="d0" smallest-unit="nanosecond" value="PT0.000000001S"></nova-input-duration>
  <nova-input-datetime slot="t1" smallest-unit="nanosecond"></nova-input-datetime>
  <output slot="output"><span class="output-label">+1ns longer label for testing</span><span class="output-value"></span></output>
</nova-input-temporal-group>
</body></html>
