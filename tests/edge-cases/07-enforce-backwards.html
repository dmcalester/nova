<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/nova-tokens.css">
<link rel="stylesheet" href="/css/nova-colors.css">
<link rel="stylesheet" href="/css/nova-form-controls.css">
<script type="module" src="/js/nova-temporal/nova-input-datetime.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-duration.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-temporal-group.js"></script>
<style>body { padding: 2rem; }</style>
</head><body>
<!-- compute group outputting a result that precedes t0 — time goes backwards -->
<nova-input-temporal-group>
  <label slot="t0-label">Start (set this after End)</label>
  <nova-input-datetime slot="t0" value="2026-04-09T16:00:00Z"></nova-input-datetime>
  <label slot="d0-label">Duration (positive)</label>
  <nova-input-duration slot="d0" value="PT1H"></nova-input-duration>
  <output slot="output"><span class="output-label">Result</span><span class="output-value"></span></output>
</nova-input-temporal-group>
<!-- range group where t1 < t0 -->
<nova-input-temporal-group>
  <nova-input-datetime slot="t0" value="2026-04-09T15:00:00Z"></nova-input-datetime>
  <nova-input-datetime slot="t1" value="2026-04-09T14:00:00Z"></nova-input-datetime>
  <output slot="output"><span class="output-label">Backwards Range</span><span class="output-value"></span></output>
</nova-input-temporal-group>
</body></html>
