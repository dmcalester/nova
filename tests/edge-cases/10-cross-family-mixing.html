<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/css/nova-tokens.css">
<link rel="stylesheet" href="/css/nova-colors.css">
<link rel="stylesheet" href="/css/nova-form-controls.css">
<script type="module" src="/js/nova-temporal/nova-input-ordinal-date.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-datetime.js"></script>
<script type="module" src="/js/nova-temporal/nova-input-temporal-group.js"></script>
<style>body { padding: 2rem; }</style>
</head><body>
<!-- Cross-family: nova-input-datetime + nova-input-ordinal-date (invalid combination) -->
<nova-input-temporal-group id="cross-1">
  <nova-input-datetime slot="t0" value="2026-04-09T14:00:00Z"></nova-input-datetime>
  <nova-input-ordinal-date slot="t1" value="2026-100"></nova-input-ordinal-date>
  <output slot="output"><span class="output-label">Cross-Family (Warning)</span><span class="output-value"></span></output>
</nova-input-temporal-group>
<!-- Within date family: two nova-input-ordinal-date (valid) -->
<nova-input-temporal-group id="same-family">
  <nova-input-ordinal-date slot="t0" value="2026-099"></nova-input-ordinal-date>
  <nova-input-ordinal-date slot="t1" value="2026-120"></nova-input-ordinal-date>
  <output slot="output"><span class="output-label">Same Family (OK)</span><span class="output-value"></span></output>
</nova-input-temporal-group>
</body></html>
