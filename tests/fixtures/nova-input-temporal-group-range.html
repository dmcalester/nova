<!doctype html>
<html><head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/css/nova-tokens.css">
  <link rel="stylesheet" href="/css/nova-colors.css">
  <link rel="stylesheet" href="/css/nova-form-controls.css">
  <script type="module" src="/js/nova-temporal/nova-input-datetime.js"></script>
  <script type="module" src="/js/nova-temporal/nova-input-temporal-group.js"></script>
</head><body>
  <nova-input-temporal-group id="group">
    <label slot="t0-label">Start</label>
    <nova-input-datetime slot="t0" id="t0" value="2026-04-09T14:00:00Z"></nova-input-datetime>
    <label slot="t1-label">End</label>
    <nova-input-datetime slot="t1" id="t1" value="2026-04-09T15:30:00Z"></nova-input-datetime>
    <output slot="output"><span class="output-label">Duration</span><span class="output-value"></span></output>
  </nova-input-temporal-group>

  <nova-input-temporal-group id="group-constrained" min="PT30M" max="PT8H">
    <nova-input-datetime slot="t0" value="2026-04-09T09:00:00Z"></nova-input-datetime>
    <nova-input-datetime slot="t1" value="2026-04-09T12:00:00Z"></nova-input-datetime>
    <output slot="output"><span class="output-label">Duration</span><span class="output-value"></span></output>
  </nova-input-temporal-group>
</body></html>
