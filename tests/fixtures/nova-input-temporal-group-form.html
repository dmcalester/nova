<!doctype html>
<html><head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/css/nova-tokens.css">
  <link rel="stylesheet" href="/css/nova-colors.css">
  <link rel="stylesheet" href="/css/nova-form-controls.css">
  <script type="module" src="/js/nova-temporal/nova-input-datetime.js"></script>
  <script type="module" src="/js/nova-temporal/nova-input-duration.js"></script>
  <script type="module" src="/js/nova-temporal/nova-input-temporal-group.js"></script>
</head><body>
  <form id="form-range">
    <nova-input-temporal-group name="window">
      <nova-input-datetime slot="t0" value="2026-04-09T09:00:00Z"></nova-input-datetime>
      <nova-input-datetime slot="t1" value="2026-04-09T17:00:00Z"></nova-input-datetime>
      <output slot="output"><span class="output-value"></span></output>
    </nova-input-temporal-group>
  </form>

  <form id="form-named">
    <nova-input-temporal-group name="window">
      <nova-input-datetime slot="t0" name="start" value="2026-04-09T09:00:00Z"></nova-input-datetime>
      <nova-input-datetime slot="t1" name="end" value="2026-04-09T17:00:00Z"></nova-input-datetime>
      <output slot="output"><span class="output-value"></span></output>
    </nova-input-temporal-group>
  </form>

  <form id="form-compute">
    <nova-input-temporal-group name="plan">
      <nova-input-datetime slot="t0" value="2026-04-09T14:00:00Z"></nova-input-datetime>
      <nova-input-duration slot="d0" value="PT2H"></nova-input-duration>
      <output slot="output"><span class="output-value"></span></output>
    </nova-input-temporal-group>
  </form>

  <form id="form-disabled">
    <nova-input-temporal-group name="window" disabled>
      <nova-input-datetime slot="t0" value="2026-04-09T09:00:00Z"></nova-input-datetime>
      <nova-input-datetime slot="t1" value="2026-04-09T17:00:00Z"></nova-input-datetime>
      <output slot="output"><span class="output-value"></span></output>
    </nova-input-temporal-group>
  </form>

  <form id="form-nameless">
    <nova-input-temporal-group>
      <nova-input-datetime slot="t0" name="start" value="2026-04-09T09:00:00Z"></nova-input-datetime>
      <nova-input-datetime slot="t1" name="end" value="2026-04-09T17:00:00Z"></nova-input-datetime>
      <output slot="output"><span class="output-value"></span></output>
    </nova-input-temporal-group>
  </form>
</body></html>
